name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-mingw:
    name: Windows MinGW
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-protobuf
            p7zip

      - uses: actions/checkout@v4

      # Qt comes from the standalone install, matching local development.
      # msys2 supplies gcc, ninja, cmake, and protobuf.
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          arch: 'win64_mingw'
          modules: 'qtshadertools'
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Acquire pinned parser packages
        shell: bash
        env:
          PARSER_PACKAGE_LOCK: ${{ vars.PARSER_PACKAGE_LOCK }}
        run: |
          python -c 'import os; from pathlib import Path; Path("parser-package-lock.json").write_text(os.environ["PARSER_PACKAGE_LOCK"])'
          python scripts/acquire_parser_packages.py parser-package-lock.json x86_64-windows-mingw parser-prefix

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DAFF_PARSER_MODE=PACKAGE \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$PWD/parser-prefix");$(cygpath -m "$QT_ROOT_DIR")"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: QT_PREFIX="$QT_ROOT_DIR" bash scripts/package_windows.sh build dist

      - name: Smoke test
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke_windows.ps1 dist

      - name: Create archive
        run: |
          cd dist
          7z a -tzip "../automotive-format-explorer-${GITHUB_REF_NAME}-windows-x64.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: automotive-format-explorer-*.zip
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # The same Qt as the Windows job.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          modules: 'qtshadertools'
          cache: true

      # Build dependencies, the xcb runtime that linuxdeploy bundles, then the
      # virtual X server and software OpenGL the launch gate runs on.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build protobuf-compiler libprotobuf-dev libabsl-dev \
            libgl1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libfontconfig1 libdbus-1-3 libegl1 libglib2.0-0t64 \
            xvfb xauth libgl1-mesa-dri

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Acquire pinned parser packages
        shell: bash
        env:
          PARSER_PACKAGE_LOCK: ${{ vars.PARSER_PACKAGE_LOCK }}
        run: |
          python -c 'import os; from pathlib import Path; Path("parser-package-lock.json").write_text(os.environ["PARSER_PACKAGE_LOCK"])'
          python scripts/acquire_parser_packages.py parser-package-lock.json x86_64-linux-gnu parser-prefix

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAFF_PARSER_MODE=PACKAGE -DCMAKE_PREFIX_PATH="$PWD/parser-prefix;$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: QT_PREFIX="$QT_ROOT_DIR" VERSION="$GITHUB_REF_NAME" bash scripts/package_linux.sh build .

      - name: Smoke test
        run: bash scripts/smoke_linux.sh .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: automotive-format-explorer-*.AppImage
          if-no-files-found: error

  # The release is created only after every platform has produced a package
  # that builds, resolves its dependency closure, and launches. A failure on
  # any platform means no release object exists, so there is nothing to
  # download.
  publish:
    name: Publish release
    needs: [windows-mingw, linux]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-mingw:
    name: Windows MinGW
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-protobuf
            p7zip

      - uses: actions/checkout@v4

      # Qt comes from the standalone install, matching local development.
      # msys2 supplies gcc, ninja, cmake, and protobuf.
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          arch: 'win64_mingw'
          modules: 'qtshadertools'
          cache: true

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$QT_ROOT_DIR")"

      - name: Build
        run: cmake --build build

      - name: Package
        run: QT_PREFIX="$QT_ROOT_DIR" bash scripts/package_windows.sh build dist

      - name: Smoke test
        run: bash scripts/smoke_windows.sh dist

      - name: Create archive
        run: |
          cd dist
          7z a -tzip "../automotive-format-explorer-${GITHUB_REF_NAME}-windows-x64.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: automotive-format-explorer-*.zip
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          modules: 'qtshadertools'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build protobuf-compiler libprotobuf-dev libabsl-dev \
            libgl1-mesa-dev libxkbcommon-dev libfuse2

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build

      - name: Package AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps \
                   AppDir/usr/share/applications

          cp build/automotive-format-explorer AppDir/usr/bin/

          # Bundled sample files (resolved via bin/../share/ at runtime).
          mkdir -p AppDir/usr/share/automotive-format-explorer
          cp -r samples AppDir/usr/share/automotive-format-explorer/samples

          cp resources/icons/explorer_256.png \
            AppDir/usr/share/icons/hicolor/256x256/apps/automotive-format-explorer.png

          cat > AppDir/usr/share/applications/automotive-format-explorer.desktop << 'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Automotive Format Explorer
          Exec=automotive-format-explorer
          Icon=automotive-format-explorer
          Categories=Development;Engineering;
          Comment=Inspect A2L, DBC, and LDF automotive files
          DESKTOP

          # Symlinks for AppImage convention.
          ln -sf usr/share/applications/automotive-format-explorer.desktop AppDir/
          ln -sf usr/share/icons/hicolor/256x256/apps/automotive-format-explorer.png AppDir/

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage

      - name: Create AppImage
        run: |
          export QMAKE="${QT_ROOT_DIR}/bin/qmake"
          export QML_SOURCES_PATHS="qml"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          mv Automotive_Format_Explorer-*.AppImage \
            automotive-format-explorer-${GITHUB_REF_NAME}-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: automotive-format-explorer-*.AppImage
          if-no-files-found: error

  # The release is created only after every platform has produced a package
  # that builds, resolves its dependency closure, and launches. A failure on
  # any platform means no release object exists, so there is nothing to
  # download.
  publish:
    name: Publish release
    needs: [windows-mingw, linux]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true

name: CI

on:
  push:
    branches: [master, 'release/**']
  pull_request:
    branches: [master]

jobs:
  package-tools:
    name: Parser package acquisition
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s scripts -p test_acquire_parser_packages.py -v

  windows-mingw:
    if: vars.PARSER_PACKAGE_LOCK != ''
    name: Windows MinGW
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-protobuf

      - uses: actions/checkout@v4

      # Same Qt as the release job and local development.
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          arch: 'win64_mingw'
          modules: 'qtshadertools'
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Acquire pinned parser packages
        shell: bash
        env:
          PARSER_PACKAGE_LOCK: ${{ vars.PARSER_PACKAGE_LOCK }}
        run: |
          python -c 'import os; from pathlib import Path; Path("parser-package-lock.json").write_text(os.environ["PARSER_PACKAGE_LOCK"])'
          python scripts/acquire_parser_packages.py parser-package-lock.json x86_64-windows-mingw parser-prefix

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DAFF_PARSER_MODE=PACKAGE \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$PWD/parser-prefix");$(cygpath -m "$QT_ROOT_DIR")"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Packaging runs on every push so a broken package surfaces here rather
      # than after a tag is cut.
      - name: Package
        run: QT_PREFIX="$QT_ROOT_DIR" bash scripts/package_windows.sh build dist

      - name: Smoke test
        run: bash scripts/smoke_windows.sh dist

  linux:
    if: vars.PARSER_PACKAGE_LOCK != ''
    name: Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          modules: 'qtshadertools'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build protobuf-compiler libprotobuf-dev libabsl-dev \
            libgl1-mesa-dev libxkbcommon-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Acquire pinned parser packages
        shell: bash
        env:
          PARSER_PACKAGE_LOCK: ${{ vars.PARSER_PACKAGE_LOCK }}
        run: |
          python -c 'import os; from pathlib import Path; Path("parser-package-lock.json").write_text(os.environ["PARSER_PACKAGE_LOCK"])'
          python scripts/acquire_parser_packages.py parser-package-lock.json x86_64-linux-gnu parser-prefix

      - name: Configure
        run: cmake -B build -G Ninja -DAFF_PARSER_MODE=PACKAGE -DCMAKE_PREFIX_PATH="$PWD/parser-prefix;$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
